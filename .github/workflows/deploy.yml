name: Build and Auto-Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 استخراج الكود من المستودع
        uses: actions/checkout@v4

      - name: ☕ إعداد جافا 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🦋 إعداد فلاتر (Flutter)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 تنزيل حزم المشروع
        run: flutter pub get

      - name: 🧪 تشغيل الفحوصات الآلية
        run: flutter test

      - name: 🌐 بناء نسخة الويب
        run: flutter build web --release --base-href /alrayyan_app/

      - name: 📱 بناء تطبيق الأندرويد العام (طلاب ومعلمين)
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk alrayyan_app_general.apk

      - name: 👑 بناء تطبيق المدير العام الخاص
        run: |
          flutter build apk -t lib/main_admin.dart --release
          cp build/app/outputs/flutter-apk/app-release.apk alrayyan_admin_manager.apk

      - name: 🚀 رفع ونشر الموقع على GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: 🌐 نشر صفحات الويب
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 🏷️ إنشاء إصدار وتحديث تلقائي على GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "إصدار مسجد الريان v1.0.${{ github.run_number }}"
          body: |
            ### 🕌 تحديث جديد لمنظومة حلقات مسجد الريان النموذجية
            * تاريخ التحديث: ${{ github.event.head_commit.timestamp }}
            * آخر تعديل: ${{ github.event.head_commit.message }}
            
            #### 📥 ملفات التطبيق المحدثة للجوال (Android APK):
            1. **تطبيق المدير العام:** `alrayyan_admin_manager.apk`
            2. **تطبيق الحلقات العام:** `alrayyan_app_general.apk`
            
            *(يمكنك تنزيل الملف وتثبيته مباشرة على هاتفك أو تحديثه من داخل التطبيق)*
          files: |
            alrayyan_app_general.apk
            alrayyan_admin_manager.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
