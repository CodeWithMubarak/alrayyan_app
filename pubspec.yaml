name: alrayyan_app
description: نظام إدارة حلقات مسجد الريان لتعليم القرآن الكريم والعلوم الشرعية
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.2.0
  firebase_messaging: ^15.1.0
  cloud_functions: ^5.0.3
  firebase_app_check: ^0.3.1+3

  # Local Database
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Network
  connectivity_plus: ^6.0.5

  # PDF & Printing
  pdf: ^3.11.1
  printing: ^5.13.1

  # Charts
  fl_chart: ^0.69.0

  # Localization & Date
  intl: ^0.20.2

  # Image
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # URL & Communication
  url_launcher: ^6.3.0
  http: ^1.2.2

  # Storage
  shared_preferences: ^2.3.2

  # UI Utilities
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  gap: ^3.0.1
  responsive_framework: ^1.4.0

  # Icons
  cupertino_icons: ^1.0.8

  # Security
  flutter_secure_storage: ^9.2.2

  # Excel Export
  excel: ^4.0.6

  # Utilities
  uuid: ^4.5.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  logger: ^2.4.0
  collection: ^1.19.0
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.21.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
